<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo_toko.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>frontend</title>
  </head>
  <body>
    <div id="error-display" style="color: red; font-family: monospace; padding: 20px; white-space: pre-wrap; z-index: 9999; position: absolute; background: white; width: 100%; height: 100%; display: none;"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.getElementById('error-display').style.display = 'block';
        document.getElementById('error-display').innerText += '\nERROR: ' + message + '\n' + (error ? error.stack : '');
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.getElementById('error-display').style.display = 'block';
        document.getElementById('error-display').innerText += '\nPROMISE REJECTION: ' + event.reason;
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
